# Standalone tmux configuration — Catppuccin Mocha pill theme
#
# Replaces oh-my-tmux framework. All settings are direct tmux commands.
#
# CATPPUCCIN MOCHA PALETTE
#   Base     #1e1e2e   Mantle   #181825   Crust    #11111b
#   Surface0 #313244   Surface1 #45475a   Surface2 #585b70
#   Overlay0 #6c7086   Overlay1 #7f849c   Overlay2 #9399b2
#   Text     #cdd6f4   Subtext1 #bac2de   Subtext0 #a6adc8
#   Mauve    #cba6f7   Blue     #89b4fa   Lavender #b4befe
#   Yellow   #f9e2af   Peach    #fab387   Red      #f38ba8
#   Green    #a6e3a1   Teal     #94e2d5   Sky      #89dceb
#
# FONT: Cascadia Code NF (Nerd Font)
#   Pill caps use Powerline Extra glyphs E0B6 (left) / E0B4 (right)
#   as literal UTF-8 characters below.


# -- options -------------------------------------------------------------------

set -g history-limit 50000
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off      # switch to next session instead of detaching
set -g display-panes-time 3000    # 3s to pick a pane number (prefix + q)

# rootshell (iOS/iPadOS/macOS) asks for these three specifically: mouse for its
# touch and gesture handling, and the bare pane title so the app can name tabs
# from what the pane reports rather than parsing a decorated string.
set -g mouse on
set -g set-titles on
set -g set-titles-string '#T'

# Sizing with more than one client attached (phone + desktop on one session).
#   window-size latest  : size to the most recently used client instead of
#                         clamping every window to the smallest attached one —
#                         without it, picking up the phone reflows the panes on
#                         the desktop.
#   aggressive-resize   : only resize windows the small client is actually
#                         looking at, not every window in the session.
set  -g window-size latest
setw -g aggressive-resize on


# -- terminal ------------------------------------------------------------------

set -g default-terminal "tmux-256color"

# set -g resets the list; subsequent -ga appends. On reload, -g resets again.
set  -g  terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title"
set -ga  terminal-features ",screen*:title"
set -ga  terminal-features ",rxvt*:ignorefkeys"
set -ga  terminal-features ",xterm-256color:RGB"
set -ga  terminal-features ",tmux-256color:clipboard"

# Truecolor for everything else too. Without this, any terminal that does not
# report exactly xterm-256color falls back to 256 colours and the Catppuccin
# hexes below get quantized. rootshell is libghostty-based and reports
# xterm-ghostty, which is exactly the case that used to miss out.
#
# If a server has no terminfo entry for the terminal's TERM (xterm-ghostty
# frequently is missing), install it there or set SetEnv TERM=xterm-256color
# for that host in ~/.ssh/config.
set -ga  terminal-features ",*:RGB"

# NOTE: extended-keys (kitty keyboard protocol) is intentionally NOT enabled.
# `set -s extended-keys always` would allow Shift+Enter etc. to pass through
# to apps like Claude Code, but it causes breakage:
#   - Shift+Tab sends raw escape codes instead of working (tmux#4304)
#   - Pasting in neovim produces artifacts (gpakosz/.tmux#776)
#   - Fish shell completions break in tmux 3.5+ (tmux#2705)
# The safer `on` mode only sends extended keys when apps opt in, but Claude
# Code doesn't opt in. Use backslash+Enter for newlines in Claude Code instead.


# -- clipboard ----------------------------------------------------------------
#
# OSC 52 clipboard chain for nested tmux (inner SSH → outer Mac → iTerm2):
#
#   App (e.g. vim) emits OSC 52
#     → inner tmux intercepts (set-clipboard on) and re-emits to its terminal
#       → SSH forwards the bytes
#         → outer tmux intercepts (set-clipboard on) and re-emits to iTerm2
#           → iTerm2 sets macOS clipboard
#
# set-clipboard on : intercept + re-emit OSC 52 from applications (path above)
# allow-passthrough : permit DCS passthrough sequences from apps inside tmux
#
# NOTE: set-clipboard on handles APP-originated OSC 52 reliably, but does NOT
# emit OSC 52 from tmux's own copy mode when nested (TERM=tmux-256color).
# Copy-mode bindings below work around this with explicit OSC 52 via copy-pipe.

set -g set-clipboard on
set -g allow-passthrough on


# -- prefix --------------------------------------------------------------------

set -g prefix C-t
set -g prefix2 None
bind -N "Send prefix to inner session" C-t send-prefix


# -- key bindings --------------------------------------------------------------

# pane navigation (vim-style)
bind -N "Select pane left"  h select-pane -L
bind -N "Select pane down"  j select-pane -D
bind -N "Select pane up"    k select-pane -U
bind -N "Select pane right" l select-pane -R

# pane resizing
bind -N "Resize pane left by 2"  -r H resize-pane -L 2
bind -N "Resize pane down by 2"  -r J resize-pane -D 2
bind -N "Resize pane up by 2"    -r K resize-pane -U 2
bind -N "Resize pane right by 2" -r L resize-pane -R 2

# split panes with current path
bind -N "Split pane horizontally" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane vertically"   _ split-window -h -c "#{pane_current_path}"

# new window with current path
bind -N "Create a new window" c new-window -c "#{pane_current_path}"

# swap windows
bind -N "Swap window left"  -r < swap-window -d -t -1
bind -N "Swap window right" -r > swap-window -d -t +1

# last window
bind -N "Select last window" Tab last-window

# detach every other client — the quick way to stop a forgotten phone or tablet
# session from having a say in window sizing
bind -N "Detach all other clients" D detach-client -a

# new session prompt
bind -N "Create a new session" C-c command-prompt -p "new session:" "new-session -s '%%'"

# reload config
bind -N "Reload tmux configuration" r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# -- nested session passthrough ------------------------------------------------
# Toggles pass-through mode for nested tmux (outer Mac + inner SSH). When
# active, all keys go directly to the inner tmux — the outer prefix, bindings,
# and copy mode are completely bypassed. A red PASS pill appears in the status
# bar while it is on.
#
# TWO KEYS, ON PURPOSE:
#   F12  — desktop keyboards (and the hyper+p layer in karabiner-ts)
#   M-F  — Apple's Magic Keyboard and Smart Keyboard Folio for iPad have NO
#          function row, so on an iPad F12 is unreachable. Without a second key
#          there is no way in, and — worse — no way back out of pass-through.
#          M-F is Alt+Shift+F, so it does not shadow readline's M-f
#          (forward-word). Not C-\, which is SIGQUIT.
#
# Both keys must be bound in BOTH tables: in pass-through the prefix is
# disabled, so the key that turns it back off cannot be a prefix binding.
#
# The display messages give immediate confirmation at the cursor. Pass-through
# swallows every key, so mistaking its state is expensive — and the PASS pill
# is easy to miss at the far edge of a phone screen.

bind -N "Toggle nested pass-through mode" -T root F12 \
  set prefix None \;\
  set key-table off \;\
  display "pass-through ON — F12 or M-F to exit" \;\
  refresh-client -S

bind -N "Toggle nested pass-through mode" -T root M-F \
  set prefix None \;\
  set key-table off \;\
  display "pass-through ON — F12 or M-F to exit" \;\
  refresh-client -S

bind -N "Toggle nested pass-through mode" -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  display "pass-through off" \;\
  refresh-client -S

bind -N "Toggle nested pass-through mode" -T off M-F \
  set -u prefix \;\
  set -u key-table \;\
  display "pass-through off" \;\
  refresh-client -S

# toggle mouse
bind -N "Toggle mouse on/off" m set -g mouse \; display "mouse #{?mouse,on,off}"

# toggle synchronized panes
bind -N "Toggle pane synchronization" S setw synchronize-panes \; display "sync #{?pane_synchronized,on,off}"

# enter copy mode
bind -N "Enter copy mode" Enter copy-mode

# browse paste buffers → view selected in a split pane
#   Opens a horizontal split showing the buffer in less. The pane is
#   resizable (prefix + H/J/K/L) and closable (prefix + x or just q).
bind -N "View a paste buffer in split" b choose-buffer -Z "split-window -v -l 40% 'tmux show-buffer -b \"%%\" | less'"

# cheatsheet popup (prefix + ?)
#   Implementation lives in ~/.config/tmux/cheatsheet.sh (linked by `dot setup
#   tmux`) — it merges the `bind -N` notes with the full list-keys output so
#   every binding appears, including plugin bindings that carry no note.
#   It used to be a single escaped one-liner here, which was unreviewable.
bind -N "Show key bindings cheatsheet" ? display-popup -w 80% -h 80% -E \
  -T " Keybindings  (/ search, q quit) " "~/.config/tmux/cheatsheet.sh"


# -- copy mode (vi) ------------------------------------------------------------

set -g mode-keys vi

# WORKAROUND: Explicit OSC 52 for nested tmux copy-mode clipboard
#
# Problem: tmux's set-clipboard on correctly intercepts and re-emits OSC 52
# from *applications* (e.g. printf '\e]52;c;...\a'), but does NOT emit OSC 52
# from its own copy mode when running nested (TERM=tmux-256color). This means
# yanking or mouse-selecting in copy mode silently fails to reach the outer
# clipboard. Tested on tmux 3.5a; the Ms terminfo capability, terminal-features
# clipboard flag, and set-clipboard on are all correctly configured — yet
# copy-mode still doesn't emit the sequence.
#
# Fix: use copy-pipe-and-cancel with an explicit command that base64-encodes
# the selection and writes an OSC 52 sequence directly to #{client_tty} (the
# terminal the tmux client is attached to, i.e. the SSH PTY). From there, the
# bytes travel through SSH → outer tmux (which intercepts via set-clipboard on
# and re-emits) → iTerm2 → macOS clipboard.

bind -N "Begin selection"              -T copy-mode-vi v send -X begin-selection
bind -N "Toggle rectangle selection"  -T copy-mode-vi C-v send -X rectangle-toggle
bind -N "Yank to clipboard (OSC 52)"  -T copy-mode-vi y send -X copy-pipe-and-cancel 'printf "\033]52;c;%s\a" "$(base64 | tr -d \\n)" > #{client_tty}'
bind -N "Cancel copy mode"            -T copy-mode-vi Escape send -X cancel
bind -N "Start of line"               -T copy-mode-vi H send -X start-of-line
bind -N "End of line"                  -T copy-mode-vi L send -X end-of-line
# Y: yank selection to paste buffer AND open it in a reference split pane.
#   copy-pipe-and-cancel saves to paste buffer + pipes to the OSC 52 clipboard
#   command (so it also reaches the system clipboard), then split-window opens
#   the buffer in less for reference. The split is resizable and closes with q.
bind -N "Yank to reference split"      -T copy-mode-vi Y send -X copy-pipe-and-cancel 'printf "\033]52;c;%s\a" "$(base64 | tr -d \\n)" > #{client_tty}' \; split-window -v -l 40% 'tmux show-buffer | less'

# mouse copy
bind -N "Copy mouse selection (OSC 52)"      -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'printf "\033]52;c;%s\a" "$(base64 | tr -d \\n)" > #{client_tty}'
bind -N "Select and copy word (OSC 52)"      -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel 'printf "\033]52;c;%s\a" "$(base64 | tr -d \\n)" > #{client_tty}'
bind -N "Select and copy line (OSC 52)"      -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel 'printf "\033]52;c;%s\a" "$(base64 | tr -d \\n)" > #{client_tty}'


# -- appearance ----------------------------------------------------------------

# fat pane borders (bg=fg for solid stripe)
set -g pane-border-style        'fg=#313244,bg=#313244'
set -g pane-active-border-style 'fg=#cba6f7,bg=#cba6f7'
set -g pane-border-indicators   colour

# messages (catppuccin yellow)
set -g message-style            'fg=#1e1e2e,bg=#f9e2af,bold'
set -g message-command-style    'fg=#f9e2af,bg=#1e1e2e,bold'

# copy/search mode
set -g mode-style               'fg=#1e1e2e,bg=#f9e2af,bold'

# clock
set -g clock-mode-colour        '#89b4fa'
set -g clock-mode-style         24


# -- status bar ----------------------------------------------------------------

# transparent background (terminal wallpaper shows through)
# These are the global baseline; client-tune.sh overrides status/status-position
# per session on attach. Without a sane global, an untuned session would fall
# back to tmux's own default (bar at the bottom).
set -g status on
set -g status-position top
set -g status-style 'fg=#cdd6f4,bg=default'

# status left: path pill
#   #{s|...|...|:var} is tmux's own substitution, and #{HOME} resolves from the
#   environment — so the home-to-~ rewrite costs nothing. It used to be
#   #(echo ... | sed ...), which forks a shell for every client on every
#   status-interval tick.
set -g status-left '#[fg=#313244,bg=default]#[fg=#cdd6f4,bg=#313244] #{s|#{HOME}|~|:pane_current_path} #[fg=#313244,bg=default] '
set -g status-left-length 60

# status right: indicators + session pill + user@host pill
#   #{?#{==:...},..}       pass-through mode (F12 / M-F toggle, red PASS pill)
#   #{?client_prefix,...}  replaces oh-my-tmux's #{prefix}
#   #{?session_many_attached,...}  replaces #{pairing}
#   #{?pane_synchronized,...}  replaces #{synchronized}
#
#   Indicators are deliberately distinct: pass-through and synchronize-panes
#   both used 🔒, which made two very different states look identical. Emoji
#   advance widths also vary by font, which shifts the pill geometry.
set -g status-right '#{?#{==:#{client_key_table},off},#[fg=#f38ba8#,bg=default]#[fg=#1e1e2e#,bg=#f38ba8#,bold] PASS #[fg=#f38ba8#,bg=default] ,}#{?client_prefix,⌨ , }#{?session_many_attached,👓 , }#{?pane_synchronized,⇄ , }#[fg=#cba6f7,bg=default]#[fg=#1e1e2e,bg=#cba6f7,bold] ◆ #S #[fg=#cba6f7,bg=default] #[fg=#313244,bg=default]#[fg=#cdd6f4,bg=#313244] #{USER}@#h #[fg=#313244,bg=default] '
set -g status-right-length 90

# window tabs (inactive pill — surface2)
setw -g window-status-style 'fg=#585b70,bg=default'
setw -g window-status-format '#[fg=#585b70,bg=default]#[fg=#9399b2,bg=#585b70] #I #W #[fg=#585b70,bg=default]'

# window tabs (active pill — lavender)
setw -g window-status-current-style 'fg=#b4befe,bg=default'
setw -g window-status-current-format '#[fg=#b4befe,bg=default]#[fg=#1e1e2e,bg=#b4befe,bold] #I #W #[fg=#b4befe,bg=default]'

# window separator (space between pills)
setw -g window-status-separator ' '

# activity / bell
setw -g window-status-activity-style 'fg=default,bg=default,underscore'
setw -g window-status-bell-style 'fg=#f38ba8,bg=default,blink,bold'


# -- per-client tuning ---------------------------------------------------------
#
# escape-time is a SERVER option, so it cannot vary per client no matter how it
# is detected — one value has to serve both. 50ms is the mobile-safe choice: at
# 10ms, an escape sequence split across packets on a cellular link is read as a
# bare Escape followed by stray characters.
set -sg escape-time 50

# Everything that CAN be per-client (status position, refresh interval, the
# padding row) is decided on attach by client-tune.sh.
#
# This used to be three `if-shell` blocks here in the config. That was wrong:
# if-shell evaluates against the tmux SERVER's environment, which is frozen when
# the server starts. Because .zshrc auto-starts tmux, the server is nearly
# always started by a local client — so every later attach from an iPad or over
# SSH was still judged "local", and `prefix + r` could not change the verdict
# either. The hook re-runs on every attach and reads the attaching client's own
# SSH_CONNECTION, which tmux copies into the session environment via
# update-environment. See tmux/client-tune.sh for the details.
#
# The client's height and session are passed in as arguments rather than looked
# up inside the script: run-shell expands these formats against the hook's own
# client, whereas an untargeted display-message inside the script is racy and
# was observed reporting the session being switched AWAY from.
set-hook -g client-attached 'run-shell "~/.config/tmux/client-tune.sh #{client_height} #{client_session}"'

# Tuning is per session, so a client switching to another session (or to one
# just created with prefix + C-c) needs the same treatment — otherwise that
# session keeps the global defaults.
set-hook -g client-session-changed 'run-shell "~/.config/tmux/client-tune.sh #{client_height} #{client_session}"'

# Also run it for the client attaching right now, so a config reload
# (prefix + r) takes effect immediately instead of on the next attach.
run-shell -b "~/.config/tmux/client-tune.sh #{client_height} #{client_session}"


# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key F
set -g @fingers-jump-key G   # default J conflicts with resize-pane -D

# Initialize tpm (must be last line)
run 'test -f ~/.config/tmux/plugins/tpm/tpm && ~/.config/tmux/plugins/tpm/tpm'
