name: shellcheck

# Lints the POSIX sh in this repository. `dot update ssh` shipped broken
# (calling an update_ssh that was never defined) because nothing checked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint scripts
        # SC2317 (unreachable command) is excluded: `dot` dispatches through
        # "${action}_${app}", so every setup_*/update_* function looks unused
        # to static analysis. The next step covers that dispatch instead.
        # scripts/dot is POSIX sh; scripts/lib/nix.sh is bash-flavored
        # (local, BASH_SOURCE, $'..') and must be linted as bash.
        run: |
          shellcheck --shell=sh   --exclude=SC2317,SC2329 scripts/dot
          shellcheck --shell=bash --exclude=SC2317,SC2329 scripts/lib/nix.sh

      - name: Check every dispatchable app has both actions
        # `dot <action> <app>` dispatches to "${action}_${app}" — a missing
        # function is only discovered at runtime, as exit 127. `doom-emacs`
        # maps to setup_doom/update_doom (shell function names cannot carry
        # dashes), so it is checked under its function spelling.
        run: |
          status=0
          for app in dot zsh zellij doom atuin ssh karabiner nix; do
            for action in setup update; do
              if ! grep -q "^${action}_${app}()"; then
                echo "missing function: ${action}_${app}()"
                status=1
              fi
            done
          done
          exit "${status}"
